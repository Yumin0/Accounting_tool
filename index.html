<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>記帳工具</title>
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="記帳工具">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="header">
    <div class="header-logo">
      <div class="logo-block">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg>
      </div>
      <span class="header-title">記帳工具</span>
    </div>
    <button class="header-settings-btn" onclick="openSheetEditor()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
  </div>

  <div class="month-nav-bar">
    <button class="month-nav-btn" onclick="changeMonth(-1)">‹</button>
    <span id="monthLabel" class="month-label"></span>
    <button class="month-nav-btn" onclick="changeMonth(1)">›</button>
  </div>
  <div id="apiBanner" style="display:none;margin:0 14px 8px;padding:8px 12px;background:#fdecea;color:#c0392b;border-radius:10px;font-size:13px;font-weight:700;word-break:break-all;"></div>

  <div class="main-summary-card">
    <div class="summary-title">本月可儲蓄</div>
    <div class="summary-saving" id="totalSaving">$0</div>
    <div class="summary-row">
      <div class="summary-item" onclick="openExpenseAnalysis()">
        <div class="summary-item-label">支出</div>
        <div class="summary-item-value" id="totalExpense">$0</div>
      </div>
      <div class="summary-vline"></div>
      <div class="summary-item" onclick="openIncomeAnalysis()">
        <div class="summary-item-label">收入</div>
        <div class="summary-item-value" id="totalIncome">$0</div>
      </div>
    </div>
  </div>

  <div class="calendar">
    <div class="month-weekdays">
      <div class="month-weekday">一</div><div class="month-weekday">二</div><div class="month-weekday">三</div>
      <div class="month-weekday">四</div><div class="month-weekday">五</div><div class="month-weekday weekend">六</div>
      <div class="month-weekday weekend">日</div>
    </div>
    <div class="month-grid" id="monthGrid"></div>
  </div>

  <div id="detailPanel"></div>

  <!-- 每日洞察區域 -->
  <div class="insight-section">
    <div class="insight-btn-row">
      <button class="insight-btn" id="insightBtn" onclick="generateTodayInsight()">✨ 產生洞察</button>
      <button class="insight-history-btn" onclick="showInsightHistory()">📋 歷史紀錄</button>
    </div>
    <div id="insightCard" style="display:none" class="insight-card">
      <div class="insight-text" id="insightText"></div>
      <div class="insight-footer">
        <span class="insight-time" id="insightTime"></span>
        <span class="insight-history-link" onclick="showInsightHistory()">查看歷史紀錄 →</span>
      </div>
    </div>
  </div>

  <!-- 洞察歷史 Modal -->
  <div class="insight-history-overlay" id="insightHistoryOverlay" onclick="closeInsightHistory()"></div>
  <div class="insight-history-modal" id="insightHistoryModal">
    <div class="drag-bar"></div>
    <div style="font-weight:bold;font-size:16px;margin-bottom:16px;flex-shrink:0;">洞察歷史紀錄</div>
    <div id="insightHistoryList" style="overflow-y:auto;flex:1;"></div>
    <button class="btn-cancel" onclick="closeInsightHistory()" style="flex-shrink:0;margin-top:14px;">關閉</button>
  </div>

  <div class="goals-section">
    <div class="goals-title">
      <span>存錢目標</span>
      <span id="goalsCountBadge" style="font-size:13px;font-weight:700;color:var(--primary);background:var(--soft);padding:3px 10px;border-radius:20px;display:none;"></span>
    </div>
    <div id="goalsList"></div>
  </div>

  <!-- 存入金額 Modal -->
  <div class="modal-overlay" id="depositOverlay" onclick="closeDepositModal()"></div>
  <div class="modal" id="depositModal">
    <div class="drag-bar"></div>
    <div style="font-weight:bold;margin-bottom:15px;">本月存入</div>
    <div id="depositGoalName" style="color:var(--muted);margin-bottom:12px;font-size:14px;"></div>
    <div class="form-row"><label>存入金額</label><input id="depositAmount" type="number" inputmode="numeric" placeholder="輸入金額"></div>
    <button class="btn-submit" id="depositSubmitBtn" onclick="submitDeposit()">確認存入</button>
    <button class="btn-cancel" onclick="closeDepositModal()">取消</button>
  </div>

  <!-- 新增記錄 Modal -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModal()"></div>
  <div class="modal" id="modal">
    <div class="drag-bar"></div>
    <div id="modalTitle" style="font-weight:bold; margin-bottom:15px;">新增記錄</div>
    <div class="type-tabs">
      <button class="type-tab active-expense" id="tabExpense" onclick="setType('expense')">支出</button>
      <button class="type-tab" id="tabIncome"  onclick="setType('income')">收入</button>
    </div>
    <div class="form-row"><label>日期</label><input id="txDate" type="date"></div>
    <div class="form-row"><label>金額</label><input id="txAmount" type="number" inputmode="numeric"></div>
    <div class="form-row"><label>分類</label><div class="category-btns" id="txCategory"></div></div>
    <div class="form-row">
      <label style="margin-bottom:4px;">備註</label>
      <input id="txNote" type="text">
      <div class="note-chips" id="noteChips"></div>
    </div>
    <button class="btn-submit" id="submitBtn" onclick="submitTransaction()">確認記錄</button>
    <button class="btn-cancel" onclick="closeModal()">取消</button>
  </div>

  <!-- 統一資料管理 Modal（最外層，z-index 最高）-->
  <div class="sheet-editor-overlay" id="sheetEditorOverlay" onclick="closeSheetEditor()"></div>
  <div class="sheet-editor-modal" id="sheetEditorModal">
    <div class="drag-bar"></div>
    <!-- Header -->
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-shrink:0;">
      <button id="sheetEditorBack" onclick="showEditorView('menu')" style="display:none;background:none;border:none;cursor:pointer;padding:4px;line-height:1;"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#3B332A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="13 4 7 10 13 16"/></svg></button>
      <div id="sheetEditorTitle" style="font-weight:bold;font-size:16px;">管理資料</div>
    </div>

    <!-- 主選單 -->
    <div id="editorViewMenu" style="overflow-y:auto;flex:1;">
      <button class="editor-menu-item" onclick="showEditorView('goals')">
        <div style="width:42px;height:42px;background:#FBEFD6;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#E8A33F" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="9"/><circle cx="11" cy="11" r="5"/><circle cx="11" cy="11" r="1.5" fill="#E8A33F" stroke="none"/></svg>
        </div>
        <div style="flex:1;">
          <div style="font-weight:bold;margin-bottom:2px;">存錢目標</div>
          <div style="font-size:13px;color:#9E9285;">新增、查看存錢目標</div>
        </div>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#C7BEB1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 4 10 8 6 12"/></svg>
      </button>
      <button class="editor-menu-item" onclick="showEditorView('categories')">
        <div style="width:42px;height:42px;background:#FBEFD6;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#E8A33F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="12" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="12" width="7" height="7" rx="1.5"/><rect x="12" y="12" width="7" height="7" rx="1.5"/></svg>
        </div>
        <div style="flex:1;">
          <div style="font-weight:bold;margin-bottom:2px;">分類管理</div>
          <div style="font-size:13px;color:#9E9285;">新增、刪除收支分類</div>
        </div>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#C7BEB1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 4 10 8 6 12"/></svg>
      </button>
      <button class="editor-menu-item" onclick="showEditorView('shortcuts')">
        <div style="width:42px;height:42px;background:#FBEFD6;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#E8A33F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3l3 3-11 11H5v-3L16 3z"/></svg>
        </div>
        <div style="flex:1;">
          <div style="font-weight:bold;margin-bottom:2px;">快捷備註</div>
          <div style="font-size:13px;color:#9E9285;">管理備註快捷字詞</div>
        </div>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#C7BEB1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 4 10 8 6 12"/></svg>
      </button>
      <button class="editor-menu-item" onclick="showEditorView('recurring')">
        <div style="width:42px;height:42px;background:#FBEFD6;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#E8A33F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="16" height="14" rx="2"/><line x1="3" y1="9" x2="19" y2="9"/><line x1="7" y1="2" x2="7" y2="5.5"/><line x1="15" y1="2" x2="15" y2="5.5"/></svg>
        </div>
        <div style="flex:1;">
          <div style="font-weight:bold;margin-bottom:2px;">固定收支</div>
          <div style="font-size:13px;color:#9E9285;">管理每月固定的支出與收入</div>
        </div>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#C7BEB1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 4 10 8 6 12"/></svg>
      </button>
    </div>

    <!-- 存錢目標子視圖 -->
    <div id="editorViewGoals" style="display:none;overflow-y:auto;flex:1;">
      <div id="editorGoalsList" style="margin-bottom:14px;"></div>
      <div style="background:#FBF7F0;border-radius:16px;padding:14px;">
        <div style="font-weight:bold;margin-bottom:12px;font-size:14px;color:#9E9285;">＋ 新增存錢目標</div>
        <div class="form-row"><label>目標名稱</label><input id="editorGoalName" type="text" placeholder="例：日本旅遊基金"></div>
        <div class="form-row"><label>目標金額</label><input id="editorGoalTarget" type="number" inputmode="numeric" placeholder="輸入金額"></div>
        <div class="form-row"><label>預計達成日期</label><input id="editorGoalDeadline" type="date"></div>
        <button class="btn-submit" id="editorGoalSubmitBtn" onclick="submitGoalFromEditor()">確認建立</button>
      </div>
    </div>

    <!-- 分類管理子視圖 -->
    <div id="editorViewCategories" style="display:none;overflow-y:auto;flex:1;">
      <div style="display:flex;border-radius:99px;overflow:hidden;background:var(--field);padding:4px;gap:4px;margin-bottom:14px;">
        <button id="editorCatTabExpense" class="editor-cat-tab active-expense" onclick="switchEditorCatTab('expense')">支出</button>
        <button id="editorCatTabIncome" class="editor-cat-tab inactive" onclick="switchEditorCatTab('income')">收入</button>
      </div>
      <div id="editorCatList" style="margin-bottom:14px;"></div>
      <div style="display:flex;gap:8px;align-items:center;">
        <input id="editorCatIcon" type="text" placeholder="😀" style="width:56px;padding:10px;border:1px solid #EDE3D5;border-radius:13px;font-size:18px;text-align:center;background:#FBF7F0;color:#3B332A;">
        <input id="editorCatName" type="text" placeholder="分類名稱" style="flex:1;padding:10px;border:1px solid #EDE3D5;border-radius:13px;font-size:16px;background:#FBF7F0;color:#3B332A;">
        <button onclick="addCategory()" style="padding:10px 16px;background:#E8A33F;color:white;border:none;border-radius:13px;cursor:pointer;white-space:nowrap;font-size:14px;font-weight:800;">新增</button>
      </div>
    </div>

    <!-- 快捷備註子視圖 -->
    <div id="editorViewShortcuts" style="display:none;overflow-y:auto;flex:1;">
      <div id="editorShortcutList" style="margin-bottom:16px;"></div>
      <div style="display:flex;flex-direction:column;gap:6px;">
        <select id="editorNewShortcutCat" style="padding:10px;border:1px solid #EDE3D5;border-radius:13px;font-size:14px;background:#FBF7F0;color:#3B332A;"></select>
        <div style="display:flex;gap:8px;">
          <input id="editorNewShortcutText" type="text" placeholder="輸入新快捷字詞" style="flex:1;padding:10px;border:1px solid #EDE3D5;border-radius:13px;font-size:16px;background:#FBF7F0;color:#3B332A;">
          <button onclick="addShortcutFromEditor()" style="padding:10px 18px;background:#E8A33F;color:white;border:none;border-radius:13px;cursor:pointer;font-size:14px;font-weight:800;white-space:nowrap;">新增</button>
        </div>
      </div>
    </div>

    <!-- 固定收支子視圖 -->
    <div id="editorViewRecurring" style="display:none;overflow-y:auto;flex:1;">
      <!-- 列表畫面 -->
      <div id="recurListWrap">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
          <div style="font-weight:bold;font-size:14px;color:#9E9285;">已建立項目</div>
          <button id="recurAddToggleBtn" onclick="toggleRecurAddForm(true)" style="padding:7px 16px;background:#E8A33F;color:white;border:none;border-radius:99px;cursor:pointer;font-size:13px;font-weight:800;font-family:inherit;">＋ 新增</button>
        </div>
        <div id="editorRecurringList" style="margin-bottom:14px;"></div>
      </div>
      <!-- 新增表單畫面 -->
      <div id="recurAddFormWrap" style="display:none;background:#FBF7F0;border-radius:16px;padding:14px;">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
          <button onclick="toggleRecurAddForm(false)" style="background:none;border:none;cursor:pointer;padding:4px;line-height:1;"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="#9E9285" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="13 4 7 10 13 16"/></svg></button>
          <div style="font-weight:bold;font-size:14px;color:#9E9285;">＋ 新增固定收支</div>
        </div>
        <div class="type-tabs" style="margin-bottom:12px;">
          <button class="type-tab active-expense" id="recurTabExpense" onclick="setRecurType('expense')">支出</button>
          <button class="type-tab" id="recurTabIncome" onclick="setRecurType('income')">收入</button>
        </div>
        <div class="form-row"><label>金額</label><input id="recurAmount" type="number" inputmode="numeric" placeholder="輸入金額"></div>
        <div class="form-row"><label>分類</label><select id="recurCategory" onchange="renderRecurNoteChips(this.value)"></select></div>
        <div class="form-row">
          <label style="margin-bottom:4px;">備註</label>
          <input id="recurNote" type="text" placeholder="例：房貸、房租收入">
          <div class="note-chips" id="recurNoteChips"></div>
        </div>
        <div class="form-row"><label>每月幾號入帳</label><select id="recurDayOfMonth"></select></div>
        <div class="form-row"><label>開始月份</label><input id="recurStartDate" type="month"></div>
        <div class="form-row"><label>結束月份（選填，長期有效可不填）</label><input id="recurEndDate" type="month"></div>
        <button class="btn-submit" id="recurSubmitBtn" onclick="submitRecurringFromEditor()">確認建立</button>
        <button class="btn-cancel" onclick="toggleRecurAddForm(false)">取消</button>
      </div>
    </div>

    <button class="btn-cancel" onclick="closeSheetEditor()" style="flex-shrink:0;margin-top:14px;">關閉</button>
  </div>

  <!-- 消費分析 Modal -->
  <div class="analysis-overlay" id="analysisOverlay" onclick="closeExpenseAnalysis()"></div>
  <div class="analysis-modal" id="analysisModal">
    <div class="drag-bar"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-shrink:0;">
      <div style="font-weight:bold;font-size:16px;" id="analysisTitle">消費分析</div>
      <div style="font-size:13px;color:#9E9285;" id="analysisMonthLabel"></div>
    </div>
    <div class="analysis-tab-row">
      <button class="analysis-tab active" id="analysisTabShare" onclick="switchAnalysisTab('share')">佔比</button>
      <button class="analysis-tab" id="analysisTabTrend" onclick="switchAnalysisTab('trend')">月趨勢</button>
    </div>
    <!-- 佔比 panel -->
    <div id="analysisPanelShare" style="overflow-y:auto;flex:1;">
      <div class="analysis-chart-area" id="analysisChartArea">
        <svg id="analysisChart" width="140" height="140" viewBox="0 0 140 140" style="flex-shrink:0;"></svg>
        <div class="analysis-legend" id="analysisLegend"></div>
      </div>
      <div id="analysisEmpty" style="display:none;text-align:center;color:#aaa;padding:40px;">本月無支出紀錄</div>
      <div id="analysisTop5Notes"></div>
    </div>
    <!-- 月趨勢 panel -->
    <div id="analysisPanelTrend" style="display:none;overflow-y:auto;flex:1;">
      <div id="trendLoading" style="display:none;text-align:center;color:#aaa;padding:30px;">載入中...</div>
      <div class="trend-cat-row" id="trendCatRow"></div>
      <svg id="trendChart" width="100%" viewBox="0 0 300 170" style="display:block;overflow:visible;"></svg>
      <div id="trendEmpty" style="display:none;text-align:center;color:#aaa;padding:40px;">近 6 個月無支出紀錄</div>
    </div>
    <button class="btn-cancel" onclick="closeExpenseAnalysis()" style="flex-shrink:0;margin-top:14px;">關閉</button>
  </div>

  <!-- FAB -->
  <div style="position:fixed;bottom:24px;right:20px;">
    <button onclick="openModal(null)" style="width:56px;height:56px;border-radius:18px;background:var(--primary);color:white;border:none;font-size:30px;box-shadow:0 6px 20px rgba(184,130,50,0.4);cursor:pointer;font-weight:900;line-height:1;display:flex;align-items:center;justify-content:center;">＋</button>
  </div>

<script src="js/state.js"></script>
<script src="js/calendar.js"></script>
<script src="js/transactions.js"></script>
<script src="js/goals.js"></script>
<script src="js/editor.js"></script>
<script src="js/recurring.js"></script>
<script src="js/categories.js"></script>
<script src="js/shortcuts.js"></script>
<script src="js/analysis.js"></script>
<script src="js/insights.js"></script>
<script src="js/main.js"></script>
</body>
</html>
