<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>記帳工具</title>
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="記帳工具">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FBF5EC;
      --surface: #FFFFFF;
      --field: #FBF7F0;
      --ink: #3B332A;
      --muted: #9E9285;
      --faint: #C7BEB1;
      --hairline: #EDE3D5;
      --primary: #E8A33F;
      --soft: #FBEFD6;
      --expense: #C9624E;
      --expense-soft: #F8E3DD;
      --income: #6F9E6E;
      --income-soft: #E2EFE1;
      --shadow-card: 0 6px 20px rgba(120,90,60,0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Nunito', -apple-system, Arial, sans-serif; background: var(--bg); color: var(--ink); font-size: 16px; }

    /* Header */
    .header { background: var(--bg); padding: 14px 16px 10px; display: flex; align-items: center; justify-content: space-between; }
    .header-logo { display: flex; align-items: center; gap: 10px; }
    .logo-block { width: 38px; height: 38px; background: var(--primary); border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .logo-block svg { width: 20px; height: 20px; stroke: white; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .header-title { font-size: 18px; font-weight: 800; color: var(--ink); }
    .header-settings-btn { width: 38px; height: 38px; background: var(--surface); border: none; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: var(--shadow-card); color: var(--ink); }

    /* Month nav */
    .month-nav-bar { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 4px 16px 14px; }
    .month-nav-btn { width: 32px; height: 32px; background: var(--surface); border: none; border-radius: 8px; cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; color: var(--ink); box-shadow: var(--shadow-card); font-weight: 700; line-height: 1; }
    .month-label { font-size: 16px; font-weight: 800; color: var(--ink); min-width: 100px; text-align: center; }

    /* Main summary card */
    .main-summary-card { margin: 0 14px 14px; background: var(--primary); border-radius: 22px; padding: 20px 22px 18px; color: white; box-shadow: var(--shadow-card); }
    .summary-title { font-size: 14px; font-weight: 700; opacity: 0.85; margin-bottom: 6px; }
    .summary-saving { font-size: 38px; font-weight: 900; margin-bottom: 18px; line-height: 1.1; }
    .summary-row { display: flex; align-items: center; }
    .summary-item { flex: 1; cursor: pointer; }
    .summary-item:active { opacity: 0.8; }
    .summary-item-label { font-size: 13px; opacity: 0.8; font-weight: 700; }
    .summary-item-value { font-size: 17px; font-weight: 800; margin-top: 3px; }
    .summary-vline { width: 1px; height: 38px; background: rgba(255,255,255,0.35); margin: 0 18px; }

    /* Calendar */
    .calendar { background: var(--surface); border-radius: 22px; margin: 0 14px 14px; box-shadow: var(--shadow-card); overflow: hidden; }
    .month-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); padding: 10px 8px 6px; border-bottom: 1px solid var(--hairline); }
    .month-weekday { text-align: center; font-size: 13px; color: var(--muted); font-weight: 700; }
    .month-weekday.weekend { color: var(--primary); }
    .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
    .week-row-line { grid-column: 1 / -1; height: 1px; background: var(--hairline); }
    .month-day { min-height: 64px; padding: 6px 3px 4px; background: var(--surface); cursor: pointer; display: flex; flex-direction: column; align-items: center; }
    .month-day.empty-cell { cursor: default; }
    .month-day.future { color: var(--muted); }
    .d-num { font-size: 14px; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; }
    .month-day.today .d-num { background: var(--primary); color: white; font-weight: 900; }
    .d-content { width: 100%; margin-top: 3px; display: flex; flex-direction: column; gap: 2px; }
    .d-exp { font-size: 10px; background: var(--expense-soft); color: var(--expense); border-radius: 6px; text-align: center; padding: 1px 2px; font-weight: 700; }
    .d-inc { font-size: 10px; background: var(--income-soft); color: var(--income); border-radius: 6px; text-align: center; padding: 1px 2px; font-weight: 700; }

    /* Detail panel */
    .detail-panel { background: var(--surface); border-radius: 20px; margin: 0 14px 14px; box-shadow: var(--shadow-card); overflow: hidden; }
    .detail-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--hairline); }
    .detail-item { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--hairline); }
    .detail-item:last-child { border-bottom: none; }
    .di-icon { font-size: 20px; width: 32px; }
    .di-info { flex: 1; }
    .di-cat { font-size: 14px; font-weight: 700; color: var(--ink); }
    .di-meta { font-size: 12px; color: var(--muted); }
    .di-amt { font-weight: 800; color: var(--expense); }
    .di-amt.income { color: var(--income); }

    /* Drag bar */
    .drag-bar { width: 38px; height: 4px; background: #EDE3D5; border-radius: 2px; margin: 0 auto 16px; flex-shrink: 0; }

    /* Modals */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(50,36,20,0.5); z-index: 100; }
    .modal-overlay.show { display: block; }
    .modal { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-radius: 24px 24px 0 0; padding: 20px; transform: translateY(100%); transition: transform 0.3s ease; z-index: 101; }
    .modal.show { transform: translateY(0); }
    .form-row { margin-bottom: 12px; }
    .form-row label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
    .form-row input, .form-row select { width: 100%; padding: 10px; border: 1px solid var(--hairline); border-radius: 13px; font-size: 16px; font-family: inherit; background: var(--field); color: var(--ink); }
    .type-tabs { display: flex; border-radius: 99px; overflow: hidden; background: var(--field); padding: 4px; margin-bottom: 12px; gap: 4px; }
    .type-tab { flex: 1; padding: 10px; border-radius: 99px; border: none; background: transparent; cursor: pointer; text-align: center; font-weight: 700; font-family: inherit; font-size: 15px; color: var(--muted); }
    .type-tab.active-expense { background: var(--primary); color: white; }
    .type-tab.active-income  { background: var(--primary); color: white; }
    .btn-submit { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 16px; font-weight: 800; cursor: pointer; font-family: inherit; font-size: 16px; }
    .btn-cancel { width: 100%; margin-top: 10px; background: none; border: none; color: var(--muted); cursor: pointer; font-family: inherit; font-size: 15px; }
    .btn-sm { padding: 4px 10px; border: 1px solid var(--hairline); border-radius: 8px; background: var(--surface); font-size: 12px; cursor: pointer; color: var(--ink); font-family: inherit; }
    .category-btns { display: flex; gap: 6px; flex-wrap: nowrap; overflow-x: auto; }
    .cat-btn { flex-shrink: 0; padding: 8px 10px; border: 1px solid var(--hairline); border-radius: 10px; background: var(--surface); cursor: pointer; font-size: 14px; white-space: nowrap; font-family: inherit; color: var(--ink); }
    .cat-btn.active { background: var(--soft); border-color: var(--primary); color: var(--primary); font-weight: 700; }

    /* Goals */
    .goals-section { padding: 0 14px 90px; }
    .goals-title { font-size: 16px; font-weight: 800; color: var(--ink); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .goal-card { background: var(--surface); border-radius: 20px; padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow-card); }
    .goal-name { font-size: 15px; font-weight: 800; color: var(--ink); }
    .goal-deadline { font-size: 12px; color: var(--muted); }
    .goal-progress-wrap { background: var(--hairline); border-radius: 20px; height: 8px; margin-bottom: 8px; overflow: hidden; }
    .goal-progress-bar { height: 8px; border-radius: 20px; background: var(--primary); transition: width 0.4s ease; }
    .goal-progress-bar.done { background: var(--income); }
    .goal-amounts { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
    .goal-deposit-btn { width: 100%; padding: 10px; background: var(--soft); color: var(--primary); border: none; border-radius: 16px; font-weight: 800; cursor: pointer; font-size: 14px; font-family: inherit; }
    .goal-deposit-btn:active { opacity: 0.8; }

    /* Note chips */
    .note-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .note-chip { padding: 5px 12px; background: var(--bg); border: 1px solid var(--hairline); border-radius: 20px; font-size: 14px; cursor: pointer; color: var(--ink); white-space: nowrap; font-family: inherit; }
    .note-chip.active { background: var(--soft); border-color: var(--primary); color: var(--primary); font-weight: 700; }

    /* Sheet editor */
    .sheet-editor-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(50,36,20,0.5); z-index: 200; }
    .sheet-editor-overlay.show { display: block; }
    .sheet-editor-modal { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-radius: 24px 24px 0 0; padding: 20px; transform: translateY(100%); transition: transform 0.3s ease; z-index: 201; max-height: 85vh; overflow: hidden; display: flex; flex-direction: column; }
    .sheet-editor-modal.show { transform: translateY(0); }
    .editor-menu-item { display: flex; align-items: center; gap: 14px; padding: 16px; border: 1px solid var(--hairline); border-radius: 16px; margin-bottom: 10px; cursor: pointer; background: var(--field); width: 100%; text-align: left; font-family: inherit; }
    .editor-menu-item:active { background: var(--bg); }
    .editor-cat-tab { flex: 1; padding: 8px; border-radius: 99px; border: none; cursor: pointer; font-size: 14px; font-weight: 700; font-family: inherit; text-align: center; }
    .editor-cat-tab.active-expense { background: var(--primary); color: white; }
    .editor-cat-tab.active-income { background: var(--primary); color: white; }
    .editor-cat-tab.inactive { background: transparent; color: var(--muted); }

    /* Insight */
    .insight-section { padding: 8px 14px 0; }
    .insight-btn-row { display: flex; gap: 10px; }
    .insight-btn { flex: 3; padding: 14px 10px; background: var(--ink); color: white; border: none; border-radius: 16px; font-size: 15px; font-weight: 800; cursor: pointer; font-family: inherit; letter-spacing: 0.3px; }
    .insight-btn:active { opacity: 0.85; }
    .insight-btn:disabled { opacity: 0.6; cursor: default; }
    .insight-history-btn { flex: 2; padding: 14px 10px; background: var(--surface); color: var(--ink); border: 1px solid var(--hairline); border-radius: 16px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; box-shadow: var(--shadow-card); }
    .insight-history-btn:active { opacity: 0.88; }
    .insight-card { background: var(--soft); border: 1px solid var(--hairline); border-radius: 16px; padding: 16px; margin-top: 10px; }
    .insight-text { font-size: 15px; line-height: 1.75; color: var(--ink); white-space: pre-wrap; }
    .insight-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
    .insight-time { font-size: 12px; color: var(--muted); }
    .insight-history-link { font-size: 13px; color: var(--primary); cursor: pointer; font-weight: 700; }
    .insight-history-link:active { opacity: 0.7; }

    /* Insight history modal */
    .insight-history-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(50,36,20,0.5); z-index: 100; }
    .insight-history-overlay.show { display: block; }
    .insight-history-modal { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-radius: 24px 24px 0 0; padding: 20px; transform: translateY(100%); transition: transform 0.3s ease; z-index: 101; max-height: 75vh; display: flex; flex-direction: column; }
    .insight-history-modal.show { transform: translateY(0); }
    .insight-history-item { padding: 12px 0; border-bottom: 1px solid var(--hairline); }
    .insight-history-item:last-child { border-bottom: none; }
    .insight-history-date { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .insight-history-text { font-size: 14px; line-height: 1.65; color: var(--ink); white-space: pre-wrap; }

    /* Analysis modal */
    .analysis-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(50,36,20,0.5); z-index: 100; }
    .analysis-overlay.show { display: block; }
    .analysis-modal { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-radius: 24px 24px 0 0; padding: 20px; transform: translateY(100%); transition: transform 0.3s ease; z-index: 101; max-height: 85vh; display: flex; flex-direction: column; }
    .analysis-modal.show { transform: translateY(0); }
    .analysis-chart-area { display: flex; align-items: center; gap: 16px; margin-bottom: 8px; }
    .analysis-legend { flex: 1; overflow-y: auto; max-height: 180px; }
    .analysis-legend-item { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--hairline); font-size: 14px; }
    .analysis-legend-item:last-child { border-bottom: none; }
    .analysis-legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .analysis-legend-name { flex: 1; color: var(--ink); }
    .analysis-legend-amt { font-weight: 700; color: var(--ink); text-align: right; white-space: nowrap; }
    .analysis-legend-pct { color: var(--muted); font-size: 13px; min-width: 42px; text-align: right; }
    .analysis-tab-row { display: flex; border-radius: 99px; overflow: hidden; background: var(--field); padding: 4px; flex-shrink: 0; margin-bottom: 14px; gap: 4px; }
    .analysis-tab { flex: 1; padding: 8px; text-align: center; font-size: 14px; font-weight: 700; cursor: pointer; background: transparent; border: none; color: var(--muted); font-family: inherit; border-radius: 99px; }
    .analysis-tab.active { background: var(--primary); color: white; }
    .trend-cat-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .trend-cat-btn { padding: 5px 12px; border: 1px solid var(--hairline); border-radius: 20px; font-size: 13px; cursor: pointer; background: var(--surface); color: var(--ink); white-space: nowrap; font-family: inherit; }
    .trend-cat-btn.active { background: var(--primary); border-color: var(--primary); color: white; font-weight: 700; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-logo">
      <div class="logo-block">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg>
      </div>
      <span class="header-title">記帳工具</span>
    </div>
    <button class="header-settings-btn" onclick="openSheetEditor()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
  </div>

  <div class="month-nav-bar">
    <button class="month-nav-btn" onclick="changeMonth(-1)">‹</button>
    <span id="monthLabel" class="month-label"></span>
    <button class="month-nav-btn" onclick="changeMonth(1)">›</button>
  </div>
  <div id="apiBanner" style="display:none;margin:0 14px 8px;padding:8px 12px;background:#fdecea;color:#c0392b;border-radius:10px;font-size:13px;font-weight:700;word-break:break-all;"></div>

  <div class="main-summary-card">
    <div class="summary-title">本月可儲蓄</div>
    <div class="summary-saving" id="totalSaving">$0</div>
    <div class="summary-row">
      <div class="summary-item" onclick="openExpenseAnalysis()">
        <div class="summary-item-label">支出</div>
        <div class="summary-item-value" id="totalExpense">$0</div>
      </div>
      <div class="summary-vline"></div>
      <div class="summary-item" onclick="openIncomeAnalysis()">
        <div class="summary-item-label">收入</div>
        <div class="summary-item-value" id="totalIncome">$0</div>
      </div>
    </div>
  </div>

  <div class="calendar">
    <div class="month-weekdays">
      <div class="month-weekday">一</div><div class="month-weekday">二</div><div class="month-weekday">三</div>
      <div class="month-weekday">四</div><div class="month-weekday">五</div><div class="month-weekday weekend">六</div>
      <div class="month-weekday weekend">日</div>
    </div>
    <div class="month-grid" id="monthGrid"></div>
  </div>

  <div id="detailPanel"></div>

  <!-- 每日洞察區域 -->
  <div class="insight-section">
    <div class="insight-btn-row">
      <button class="insight-btn" id="insightBtn" onclick="generateTodayInsight()">✨ 產生洞察</button>
      <button class="insight-history-btn" onclick="showInsightHistory()">📋 歷史紀錄</button>
    </div>
    <div id="insightCard" style="display:none" class="insight-card">
      <div class="insight-text" id="insightText"></div>
      <div class="insight-footer">
        <span class="insight-time" id="insightTime"></span>
        <span class="insight-history-link" onclick="showInsightHistory()">查看歷史紀錄 →</span>
      </div>
    </div>
  </div>

  <!-- 洞察歷史 Modal -->
  <div class="insight-history-overlay" id="insightHistoryOverlay" onclick="closeInsightHistory()"></div>
  <div class="insight-history-modal" id="insightHistoryModal">
    <div class="drag-bar"></div>
    <div style="font-weight:bold;font-size:16px;margin-bottom:16px;flex-shrink:0;">洞察歷史紀錄</div>
    <div id="insightHistoryList" style="overflow-y:auto;flex:1;"></div>
    <button class="btn-cancel" onclick="closeInsightHistory()" style="flex-shrink:0;margin-top:14px;">關閉</button>
  </div>

  <div class="goals-section">
    <div class="goals-title">
      <span>存錢目標</span>
      <span id="goalsCountBadge" style="font-size:13px;font-weight:700;color:var(--primary);background:var(--soft);padding:3px 10px;border-radius:20px;display:none;"></span>
    </div>
    <div id="goalsList"></div>
  </div>

  <!-- 存入金額 Modal -->
  <div class="modal-overlay" id="depositOverlay" onclick="closeDepositModal()"></div>
  <div class="modal" id="depositModal">
    <div class="drag-bar"></div>
    <div style="font-weight:bold;margin-bottom:15px;">本月存入</div>
    <div id="depositGoalName" style="color:var(--muted);margin-bottom:12px;font-size:14px;"></div>
    <div class="form-row"><label>存入金額</label><input id="depositAmount" type="number" inputmode="numeric" placeholder="輸入金額"></div>
    <button class="btn-submit" id="depositSubmitBtn" onclick="submitDeposit()">確認存入</button>
    <button class="btn-cancel" onclick="closeDepositModal()">取消</button>
  </div>

  <!-- 新增記錄 Modal -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModal()"></div>
  <div class="modal" id="modal">
    <div class="drag-bar"></div>
    <div id="modalTitle" style="font-weight:bold; margin-bottom:15px;">新增記錄</div>
    <div class="type-tabs">
      <button class="type-tab active-expense" id="tabExpense" onclick="setType('expense')">支出</button>
      <button class="type-tab" id="tabIncome"  onclick="setType('income')">收入</button>
    </div>
    <div class="form-row"><label>日期</label><input id="txDate" type="date"></div>
    <div class="form-row"><label>金額</label><input id="txAmount" type="number" inputmode="numeric"></div>
    <div class="form-row"><label>分類</label><div class="category-btns" id="txCategory"></div></div>
    <div class="form-row">
      <label style="margin-bottom:4px;">備註</label>
      <input id="txNote" type="text">
      <div class="note-chips" id="noteChips"></div>
    </div>
    <button class="btn-submit" id="submitBtn" onclick="submitTransaction()">確認記錄</button>
    <button class="btn-cancel" onclick="closeModal()">取消</button>
  </div>

  <!-- 統一資料管理 Modal（最外層，z-index 最高）-->
  <div class="sheet-editor-overlay" id="sheetEditorOverlay" onclick="closeSheetEditor()"></div>
  <div class="sheet-editor-modal" id="sheetEditorModal">
    <div class="drag-bar"></div>
    <!-- Header -->
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-shrink:0;">
      <button id="sheetEditorBack" onclick="showEditorView('menu')" style="display:none;background:none;border:none;cursor:pointer;padding:4px;line-height:1;"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#3B332A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="13 4 7 10 13 16"/></svg></button>
      <div id="sheetEditorTitle" style="font-weight:bold;font-size:16px;">管理資料</div>
    </div>

    <!-- 主選單 -->
    <div id="editorViewMenu" style="overflow-y:auto;flex:1;">
      <button class="editor-menu-item" onclick="showEditorView('goals')">
        <div style="width:42px;height:42px;background:#FBEFD6;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">

      </button>
      <button class="editor-menu-item" onclick="showEditorView('shortcuts')">
        <div style="width:42px;height:42px;background:#FBEFD6;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#E8A33F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3l3 3-11 11H5v-3L16 3z"/></svg>

        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#C7BEB1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 4 10 8 6 12"/></svg>
      </button>
    </div>

    <!-- 存錢目標子視圖 -->
    <div id="editorViewGoals" style="display:none;overflow-y:auto;flex:1;">
      <div id="editorGoalsList" style="margin-bottom:14px;"></div>
      <div style="background:#FBF7F0;border-radius:16px;padding:14px;">
        <div style="font-weight:bold;margin-bottom:12px;font-size:14px;color:#9E9285;">＋ 新增存錢目標</div>
        <div class="form-row"><label>目標名稱</label><input id="editorGoalName" type="text" placeholder="例：日本旅遊基金"></div>
        <div class="form-row"><label>目標金額</label><input id="editorGoalTarget" type="number" inputmode="numeric" placeholder="輸入金額"></div>
        <div class="form-row"><label>預計達成日期</label><input id="editorGoalDeadline" type="date"></div>
        <button class="btn-submit" id="editorGoalSubmitBtn" onclick="submitGoalFromEditor()">確認建立</button>
      </div>
    </div>

    <!-- 分類管理子視圖 -->
    <div id="editorViewCategories" style="display:none;overflow-y:auto;flex:1;">
      <div style="display:flex;border-radius:99px;overflow:hidden;background:var(--field);padding:4px;gap:4px;margin-bottom:14px;">
        <button id="editorCatTabExpense" class="editor-cat-tab active-expense" onclick="switchEditorCatTab('expense')">支出</button>
        <button id="editorCatTabIncome" class="editor-cat-tab inactive" onclick="switchEditorCatTab('income')">收入</button>
      </div>
      <div id="editorCatList" style="margin-bottom:14px;"></div>
      <div style="display:flex;gap:8px;align-items:center;">
        <input id="editorCatIcon" type="text" placeholder="😀" style="width:56px;padding:10px;border:1px solid #EDE3D5;border-radius:13px;font-size:18px;text-align:center;background:#FBF7F0;color:#3B332A;">
        <input id="editorCatName" type="text" placeholder="分類名稱" style="flex:1;padding:10px;border:1px solid #EDE3D5;border-radius:13px;font-size:16px;background:#FBF7F0;color:#3B332A;">
        <button onclick="addCategory()" style="padding:10px 16px;background:#E8A33F;color:white;border:none;border-radius:13px;cursor:pointer;white-space:nowrap;font-size:14px;font-weight:800;">新增</button>

    <!-- 快捷備註子視圖 -->
    <div id="editorViewShortcuts" style="display:none;overflow-y:auto;flex:1;">
      <div id="editorShortcutList" style="margin-bottom:16px;"></div>
      <div style="display:flex;flex-direction:column;gap:6px;">
        <select id="editorNewShortcutCat" style="padding:10px;border:1px solid #EDE3D5;border-radius:13px;font-size:14px;background:#FBF7F0;color:#3B332A;"></select>
        <div style="display:flex;gap:8px;">
          <input id="editorNewShortcutText" type="text" placeholder="輸入新快捷字詞" style="flex:1;padding:10px;border:1px solid #EDE3D5;border-radius:13px;font-size:16px;background:#FBF7F0;color:#3B332A;">
          <button onclick="addShortcutFromEditor()" style="padding:10px 18px;background:#E8A33F;color:white;border:none;border-radius:13px;cursor:pointer;font-size:14px;font-weight:800;white-space:nowrap;">新增</button>

    <button class="btn-cancel" onclick="closeSheetEditor()" style="flex-shrink:0;margin-top:14px;">關閉</button>

  <!-- 消費分析 Modal -->
  <div class="analysis-overlay" id="analysisOverlay" onclick="closeExpenseAnalysis()"></div>
  <div class="analysis-modal" id="analysisModal">

      <div style="font-weight:bold;font-size:16px;" id="analysisTitle">消費分析</div>
      <div style="font-size:13px;color:#9E9285;" id="analysisMonthLabel"></div>
    </div>
    <div class="analysis-tab-row">
      <button class="analysis-tab active" id="analysisTabShare" onclick="switchAnalysisTab('share')">佔比</button>
      <button class="analysis-tab" id="analysisTabTrend" onclick="switchAnalysisTab('trend')">月趨勢</button>
    </div>
    <!-- 佔比 panel -->
    <div id="analysisPanelShare" style="overflow-y:auto;flex:1;">
      <div class="analysis-chart-area" id="analysisChartArea">
        <svg id="analysisChart" width="140" height="140" viewBox="0 0 140 140" style="flex-shrink:0;"></svg>
        <div class="analysis-legend" id="analysisLegend"></div>
      </div>
      <div id="analysisEmpty" style="display:none;text-align:center;color:#aaa;padding:40px;">本月無支出紀錄</div>
      <div id="analysisTop5Notes"></div>
    </div>
    <!-- 月趨勢 panel -->
    <div id="analysisPanelTrend" style="display:none;overflow-y:auto;flex:1;">
      <div id="trendLoading" style="display:none;text-align:center;color:#aaa;padding:30px;">載入中...</div>
      <div class="trend-cat-row" id="trendCatRow"></div>
      <svg id="trendChart" width="100%" viewBox="0 0 300 170" style="display:block;overflow:visible;"></svg>
      <div id="trendEmpty" style="display:none;text-align:center;color:#aaa;padding:40px;">近 6 個月無支出紀錄</div>
    </div>
    <button class="btn-cancel" onclick="closeExpenseAnalysis()" style="flex-shrink:0;margin-top:14px;">關閉</button>
  </div>

  <!-- FAB -->
  <div style="position:fixed;bottom:24px;right:20px;">
    <button onclick="openModal(null)" style="width:56px;height:56px;border-radius:18px;background:var(--primary);color:white;border:none;font-size:30px;box-shadow:0 6px 20px rgba(184,130,50,0.4);cursor:pointer;font-weight:900;line-height:1;display:flex;align-items:center;justify-content:center;">＋</button>
  </div>

<script>
  async function gasAPI(action, params = {}) {
    // 用 URL constructor + location.href 保證在任何環境（Safari/PWA/WKWebView）都能產生合法絕對 URL
    const base = new URL('/api', location.href);
    base.searchParams.set('action', action);
    for (const [k, v] of Object.entries(params)) {
      base.searchParams.set(k, (typeof v === 'object' && v !== null) ? JSON.stringify(v) : String(v));
    }
    const res = await fetch(base.href);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }

  let currentYear = new Date().getFullYear();
  let currentMonth = new Date().getMonth() + 1;
  let allCategories = [];
  let allTxData = [];
  let allGoals = [];
  let allNoteShortcuts = [];
  let editingId = null;
  let currentTxType = 'expense';
  let depositingGoalId = null;
  let currentEditorCatTab = 'expense';

  function getMonthStr() { return currentYear + '-' + String(currentMonth).padStart(2, '0'); }
  function formatDate(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
  function fmtAmt(n) { return n >= 10000 ? Math.round(n / 1000) + 'k' : n.toLocaleString(); }

  async function changeMonth(delta) {
    currentMonth += delta;
    if (currentMonth > 12) { currentMonth = 1; currentYear++; }
    if (currentMonth < 1)  { currentMonth = 12; currentYear--; }
    document.getElementById('detailPanel').innerHTML = '';
    await loadAll();
  }

  // 本地快取 key
  function cacheKey() { return 'acct_cache_' + getMonthStr(); }

  // 初始化載入
  async function loadAll() {
    const monthStr = getMonthStr();
    document.getElementById('monthLabel').textContent = currentYear + '年 ' + currentMonth + '月';

    // 1. 立即從 localStorage 顯示快取（stale-while-revalidate）
    try {
      const cached = localStorage.getItem(cacheKey());
      if (cached) {
        const d = JSON.parse(cached);
        allCategories    = d.categories    || [];
        allTxData        = d.transactions  || [];
        allGoals         = d.goals         || [];
        allNoteShortcuts = d.noteShortcuts || [];
        updateCategorySelect();
        updateSummary();
        renderMonthView();
        renderGoals();
        renderNoteChips();
      }
    } catch(e) { /* 快取損壞就忽略 */ }

    // 2. 背景抓取最新資料（單次 API 呼叫取代原本 4 次）
    try {
      const data = await gasAPI('getAll', { month: monthStr });
      allCategories    = data.categories    || [];
      allTxData        = data.transactions  || [];
      allGoals         = data.goals         || [];
      allNoteShortcuts = data.noteShortcuts || [];

      // 存回快取
      localStorage.setItem(cacheKey(), JSON.stringify(data));

      updateCategorySelect();
      updateSummary();
      renderMonthView();
      renderGoals();
      renderNoteChips();
    } catch (err) {
      console.error("載入失敗", err);
      const errBanner = document.getElementById('apiBanner');
      if (errBanner) {
        const ctx = 'href=' + location.href + ' standalone=' + (window.navigator.standalone ?? 'n/a');
        errBanner.textContent = '⚠ ' + (err.message || String(err)) + ' | ' + ctx;
        errBanner.style.display = 'block';
      }
    }
  }

  function updateSummary() {
    let exp = 0, inc = 0;
    allTxData.forEach(tx => {
      if (tx.type === 'expense') exp += Number(tx.amount);
      else inc += Number(tx.amount);
    });
    document.getElementById('totalExpense').textContent = '$' + exp.toLocaleString();
    document.getElementById('totalIncome').textContent  = '$' + inc.toLocaleString();
    document.getElementById('totalSaving').textContent  = '$' + (inc - exp).toLocaleString();
  }

  function renderMonthView() {
    const today = formatDate(new Date());
    const firstDay = new Date(currentYear, currentMonth - 1, 1);
    const lastDay  = new Date(currentYear, currentMonth, 0);
    const offset = (firstDay.getDay() === 0) ? 6 : firstDay.getDay() - 1;

    let html = '';
    let cells = [];

    for (let i = 0; i < offset; i++) cells.push('<div class="month-day empty-cell"><div class="d-num"></div></div>');

    for (let day = 1; day <= lastDay.getDate(); day++) {
      const dateStr = getMonthStr() + '-' + String(day).padStart(2,'0');
      const isToday = dateStr === today;
      const dayTx = allTxData.filter(tx => tx.date === dateStr);
      const dayExp = dayTx.filter(tx => tx.type === 'expense').reduce((s, t) => s + Number(t.amount), 0);
      const dayInc = dayTx.filter(tx => tx.type === 'income').reduce((s, t) => s + Number(t.amount), 0);

      let cls = 'month-day' + (isToday ? ' today' : '');
      let cell = `<div class="${cls}" onclick="handleDayClick('${dateStr}')">
        <div class="d-num">${day}</div>
        <div class="d-content">
          ${dayExp > 0 ? `<div class="d-exp">${fmtAmt(dayExp)}</div>` : ''}
          ${dayInc > 0 ? `<div class="d-inc">${fmtAmt(dayInc)}</div>` : ''}
        </div>
      </div>`;
      cells.push(cell);
    }

    cells.forEach((c, idx) => {
      if (idx > 0 && idx % 7 === 0) html += '<div class="week-row-line"></div>';
      html += c;
    });
    document.getElementById('monthGrid').innerHTML = html;
  }

  function handleDayClick(dateStr) {
    const dayTx = allTxData.filter(tx => tx.date === dateStr);
    if (dayTx.length === 0) openModal(dateStr);
    else showDayDetail(dateStr, dayTx);
  }

  function showDayDetail(dateStr, dayTx) {
    const panel = document.getElementById('detailPanel');
    const catMap = {};
    allCategories.forEach(c => { catMap[c.name] = c.icon; });

    let html = `<div class="detail-panel">
      <div class="detail-header">
        <div style="font-weight:bold">📅 ${dateStr}</div>
        <div>
          <button class="btn-sm" onclick="openModal('${dateStr}')">＋ 新增</button>
          <button class="btn-sm" onclick="document.getElementById('detailPanel').innerHTML=''">✕</button>
        </div>
      </div>`;

    dayTx.forEach(tx => {
      const icon = catMap[tx.category] || '📦';
      html += `<div class="detail-item">
        <div class="di-icon">${icon}</div>
        <div class="di-info">
          <div class="di-cat">${tx.category}</div>
          <div class="di-meta">${tx.note || ''}</div>
        </div>
        <div style="text-align:right">
          <div class="di-amt ${tx.type==='income'?'income':''}">$${tx.amount}</div>
          <div style="margin-top:4px">
            <button class="btn-sm" onclick="editItem('${tx.id}')">改</button>
            <button class="btn-sm" style="color:red" onclick="deleteItem('${tx.id}')">刪</button>
          </div>
        </div>
      </div>`;
    });
    panel.innerHTML = html + '</div>';
    panel.scrollIntoView({ behavior: 'smooth' });
  }

  function openModal(dateStr) {
    editingId = null;
    document.getElementById('txDate').value = dateStr || formatDate(new Date());
    document.getElementById('txAmount').value = '';
    document.getElementById('txNote').value = '';
    document.querySelectorAll('#noteChips .note-chip').forEach(b => b.classList.remove('active'));
    document.getElementById('modalOverlay').classList.add('show');
    document.getElementById('modal').classList.add('show');
    setType('expense');
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('show');
    document.getElementById('modalOverlay').classList.remove('show');
  }

  function setType(type) {
    currentTxType = type;
    document.getElementById('tabExpense').className = 'type-tab' + (type === 'expense' ? ' active-expense' : '');
    document.getElementById('tabIncome').className = 'type-tab' + (type === 'income' ? ' active-income' : '');
    updateCategorySelect();
  }

  function updateCategorySelect(selectedName) {
    const container = document.getElementById('txCategory');
    const cats = allCategories.filter(c => c.type === currentTxType);
    container.innerHTML = cats.map((c, i) =>
      `<button class="cat-btn${(!selectedName && i === 0) || c.name === selectedName ? ' active' : ''}" onclick="selectCategory(this)" data-value="${c.name}">${c.icon} ${c.name}</button>`
    ).join('');
    // 依當前選中分類刷新快捷字詞
    const activeCat = selectedName || cats[0]?.name || '';
    renderNoteChips(activeCat);
  }

  function selectCategory(btn) {
    document.querySelectorAll('#txCategory .cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    // 清空備註並依新分類更新快捷字詞
    document.getElementById('txNote').value = '';
    renderNoteChips(btn.dataset.value);
  }

  async function submitTransaction() {
    const amount = document.getElementById('txAmount').value;
    if (!amount) return alert("請輸入金額");

    const data = {
      id: editingId || Date.now().toString(),
      date: document.getElementById('txDate').value,
      type: currentTxType,
      category: document.querySelector('#txCategory .cat-btn.active')?.dataset.value || '',
      amount: amount,
      note: document.getElementById('txNote').value
    };

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerText = "傳送中...";

    try {
      if (editingId) {
        await gasAPI('updateTransaction', { id: editingId, data });
      } else {
        await gasAPI('addTransaction', { data });
      }
      closeModal();
      await loadAll();
    } catch (err) {
      alert("儲存失敗");
    } finally {
      btn.disabled = false;
      btn.innerText = "確認記錄";
    }
  }

  async function editItem(id) {
    const tx = allTxData.find(t => t.id == id);
    if (!tx) return;
    editingId = id;
    document.getElementById('txDate').value = tx.date;
    document.getElementById('txAmount').value = tx.amount;
    document.getElementById('txNote').value = tx.note;
    document.querySelectorAll('#noteChips .note-chip').forEach(b => b.classList.remove('active'));
    setType(tx.type);
    updateCategorySelect(tx.category);
    document.getElementById('modalOverlay').classList.add('show');
    document.getElementById('modal').classList.add('show');
  }

  async function deleteItem(id) {
    if (!confirm("確定刪除？")) return;
    try {
      await gasAPI('deleteTransaction', { id });
      document.getElementById('detailPanel').innerHTML = '';
      await loadAll();
    } catch (err) {
      alert("刪除失敗");
    }
  }

  // === 快捷備註 ===
  function renderNoteChips(catName) {
    const container = document.getElementById('noteChips');
    if (!container) return;
    // 顯示：符合當前分類 OR 未綁定分類（category 為空）的快捷字詞
    const filtered = allNoteShortcuts.filter(s => !s.category || s.category === catName);
    container.innerHTML = filtered.map(s =>
      `<button class="note-chip" onclick="selectNoteChip(this,'${s.text.replace(/'/g, "\\'")}')">${s.text}</button>`
    ).join('');
  }

  function selectNoteChip(btn, text) {
    const noteInput = document.getElementById('txNote');
    if (btn.classList.contains('active')) {
      btn.classList.remove('active');
      noteInput.value = '';
    } else {
      document.querySelectorAll('#noteChips .note-chip').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      noteInput.value = text;
    }
  }

  // === 存錢目標 ===
  function renderGoals() {
    const list = document.getElementById('goalsList');
    const active = allGoals
      .filter(g => g.status === 'active')
      .sort((a, b) => {
        const pctA = Number(a.saved_amount) / (Number(a.target_amount) || 1);
        const pctB = Number(b.saved_amount) / (Number(b.target_amount) || 1);
        const doneA = pctA >= 1 ? 1 : 0;
        const doneB = pctB >= 1 ? 1 : 0;
        return doneA - doneB;
      });
    const badge = document.getElementById('goalsCountBadge');
    if (badge) { badge.textContent = active.length + ' 個進行中'; badge.style.display = active.length > 0 ? '' : 'none'; }
    if (active.length === 0) {
      list.innerHTML = '<div style="text-align:center;color:var(--muted);padding:20px;">尚無存錢目標，點右上角設定新增</div>';
      return;
    }
    list.innerHTML = active.map(g => {
      const saved = Number(g.saved_amount) || 0;
      const target = Number(g.target_amount) || 1;
      const pct = Math.min(100, Math.round(saved / target * 100));
      const done = pct >= 100;
      return `<div class="goal-card">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;">
          <div class="goal-name">${g.name}</div>
          <div class="goal-deadline">${g.deadline}</div>
        </div>
        <div class="goal-progress-wrap">
          <div class="goal-progress-bar${done ? ' done' : ''}" style="width:${pct}%"></div>
        </div>
        <div class="goal-amounts">
          <span>已存 $${saved.toLocaleString()}</span>
          <span>${pct}% · $${target.toLocaleString()}</span>
        </div>
        ${done
          ? '<div style="text-align:center;color:#6F9E6E;font-weight:800;padding:6px 0;font-size:15px;">目標達成</div>'
          : `<button class="goal-deposit-btn" onclick="openDepositModal('${g.id}','${g.name}',${saved})">本月存入</button>`
        }
      </div>`;
    }).join('');
  }

  function openDepositModal(goalId, goalName, currentSaved) {
    depositingGoalId = goalId;
    document.getElementById('depositGoalName').textContent = `目標：${goalName}（已存 $${Number(currentSaved).toLocaleString()}）`;
    document.getElementById('depositAmount').value = '';
    document.getElementById('depositOverlay').classList.add('show');
    document.getElementById('depositModal').classList.add('show');
  }

  function closeDepositModal() {
    document.getElementById('depositModal').classList.remove('show');
    document.getElementById('depositOverlay').classList.remove('show');
    depositingGoalId = null;
  }

  async function submitDeposit() {
    const amount = Number(document.getElementById('depositAmount').value);
    if (!amount || amount <= 0) return alert("請輸入有效金額");
    const goal = allGoals.find(g => g.id === depositingGoalId);
    if (!goal) return;
    const newSaved = (Number(goal.saved_amount) || 0) + amount;
    const btn = document.getElementById('depositSubmitBtn');
    btn.disabled = true; btn.innerText = "傳送中...";
    try {
      await gasAPI('updateGoal', { id: depositingGoalId, data: { saved_amount: newSaved } });
      await gasAPI('addSavingsLog', { data: {
        id: 'log_' + Date.now(),
        goal_id: depositingGoalId,
        goal_name: goal.name,
        amount: amount,
        saved_date: formatDate(new Date())
      }});
      closeDepositModal();
      allGoals = await gasAPI('getGoals');
      renderGoals();
    } catch (err) {

  function renderTop5Notes() {
    const el = document.getElementById('analysisTop5Notes');
    const isExpense = currentAnalysisType === 'expense';
    const noteTotals = {};
    let total = 0;
    allTxData.forEach(tx => {
      if (tx.type !== currentAnalysisType) return;
      const key = tx.note || tx.category || '（無備註）';
      noteTotals[key] = (noteTotals[key] || 0) + Number(tx.amount);
      total += Number(tx.amount);
    });
    const items = Object.entries(noteTotals)
      .map(([note, amount]) => ({ note, amount }))
      .sort((a, b) => b.amount - a.amount)
      .slice(0, 5);
    if (!items.length || total === 0) { el.innerHTML = ''; return; }
    const title = isExpense ? '本月支出 Top 5 明細' : '本月收入 Top 5 明細';
    const amtColor = isExpense ? '#C9624E' : '#6F9E6E';
    let html = `<div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--hairline);">
      <div style="font-size:14px;font-weight:800;color:var(--ink);margin-bottom:8px;">${title}</div>`;
    items.forEach((item, i) => {
      const pct = Math.round(item.amount / total * 100);
      const amt = item.amount >= 10000 ? Math.round(item.amount / 1000) + 'k' : item.amount.toLocaleString();
      html += `<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #EDE3D5;font-size:14px;">
        <span style="width:20px;text-align:center;font-weight:bold;color:#9E9285;">${i + 1}</span>
        <span style="flex:1;color:#3B332A;">${item.note}</span>
        <span style="font-weight:bold;color:${amtColor};">$${amt}</span>
        <span style="color:#9E9285;font-size:13px;min-width:38px;text-align:right;">${pct}%</span>
      </div>`;
    });
    html += '</div>';
    el.innerHTML = html;
  }

  function renderShareView() {
    const catTotals = {};
    allTxData.forEach(tx => {
      if (tx.type !== currentAnalysisType) return;
      catTotals[tx.category] = (catTotals[tx.category] || 0) + Number(tx.amount);
    });
    const total = Object.values(catTotals).reduce((s, v) => s + v, 0);
    const items = Object.entries(catTotals)
      .map(([name, amount]) => ({ name, amount }))
      .sort((a, b) => b.amount - a.amount);
    if (!items.length || total === 0) {
      document.getElementById('analysisEmpty').textContent = currentAnalysisType === 'expense' ? '本月無支出紀錄' : '本月無收入紀錄';
      document.getElementById('analysisEmpty').style.display = 'block';

    } else {
      document.getElementById('analysisEmpty').style.display = 'none';
      document.getElementById('analysisChartArea').style.display = 'flex';
      renderDonutChart(items, total);
      renderAnalysisLegend(items, total);
    }
    renderTop5Notes();

  function renderDonutChart(items, total) {
    const svg = document.getElementById('analysisChart');
    const cx = 70, cy = 70, r = 52, strokeW = 22;
    const circ = 2 * Math.PI * r;
    let html = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#EDE3D5" stroke-width="${strokeW}"/>`;
    let accumulated = 0;
    items.forEach((item, i) => {
      const dash = (item.amount / total) * circ;
      const color = ANALYSIS_COLORS[i % ANALYSIS_COLORS.length];
      html += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${strokeW}"
        stroke-dasharray="${dash} ${circ - dash}"
        stroke-dashoffset="${-accumulated}"
        transform="rotate(-90 ${cx} ${cy})"/>`;
      accumulated += dash;
    });
    const totalLabel = total >= 10000 ? Math.round(total / 1000) + 'k' : total.toLocaleString();
    const centerLabel = currentAnalysisType === 'expense' ? '支出' : '收入';
    html += `<text x="${cx}" y="${cy - 6}" text-anchor="middle" font-size="12" fill="#9E9285">${centerLabel}</text>
      <text x="${cx}" y="${cy + 12}" text-anchor="middle" font-size="15" font-weight="bold" fill="#3B332A">$${totalLabel}</text>`;
    svg.innerHTML = html;
  }

  function renderAnalysisLegend(items, total) {
    document.getElementById('analysisLegend').innerHTML = items.map((item, i) => {
      const color = ANALYSIS_COLORS[i % ANALYSIS_COLORS.length];
      const pct = Math.round(item.amount / total * 100);
      const amt = item.amount >= 10000 ? Math.round(item.amount / 1000) + 'k' : item.amount.toLocaleString();
      return `<div class="analysis-legend-item">
        <div class="analysis-legend-dot" style="background:${color}"></div>
        <span class="analysis-legend-name">${item.name}</span>
        <span class="analysis-legend-amt">$${amt}</span>
        <span class="analysis-legend-pct">${pct}%</span>
      </div>`;
    }).join('');
  }

  function getRecentMonths(n) {
    const months = [];
    let y = currentYear, m = currentMonth;
    for (let i = 0; i < n; i++) {
      months.unshift(y + '-' + String(m).padStart(2, '0'));
      m--;
      if (m < 1) { m = 12; y--; }
    }
    return months;
  }

  async function loadAndRenderTrend() {
    if (trendDataCache) { renderTrendView(); return; }
    document.getElementById('trendLoading').style.display = 'block';
    document.getElementById('trendCatRow').innerHTML = '';
    document.getElementById('trendChart').innerHTML = '';
    document.getElementById('trendEmpty').style.display = 'none';
    const months = getRecentMonths(6);
    try {
      const results = await Promise.all(months.map(m => gasAPI('getTransactions', { month: m })));
      const byCategory = {};
      results.forEach((txList, idx) => {
        (txList || []).forEach(tx => {
          if (tx.type !== currentAnalysisType) return;
          if (!byCategory[tx.category]) byCategory[tx.category] = Array(6).fill(0);
          byCategory[tx.category][idx] += Number(tx.amount);
        });
      });
      trendDataCache = { months, byCategory };
      const sorted = Object.keys(byCategory).sort((a, b) =>
        byCategory[b].reduce((s, v) => s + v, 0) - byCategory[a].reduce((s, v) => s + v, 0));
      currentTrendCat = sorted[0] || '';
    } catch (e) {
      trendDataCache = { months, byCategory: {} };
      currentTrendCat = '';
    }
    document.getElementById('trendLoading').style.display = 'none';
    renderTrendView();
  }

  function renderTrendView() {
    if (!trendDataCache) return;
    const { months, byCategory } = trendDataCache;
    const catMap = {};
    allCategories.forEach(c => { catMap[c.name] = c.icon; });
    const sortedCats = Object.keys(byCategory).sort((a, b) =>
      byCategory[b].reduce((s, v) => s + v, 0) - byCategory[a].reduce((s, v) => s + v, 0));
    document.getElementById('trendCatRow').innerHTML = sortedCats.map(name => {
      const icon = catMap[name] || '';
      return `<button class="trend-cat-btn${name === currentTrendCat ? ' active' : ''}" onclick="selectTrendCat('${name.replace(/'/g, "\\'")}')">${icon} ${name}</button>`;
    }).join('');
    if (!sortedCats.length) {
      document.getElementById('trendEmpty').textContent = currentAnalysisType === 'expense' ? '近 6 個月無支出紀錄' : '近 6 個月無收入紀錄';
      document.getElementById('trendEmpty').style.display = 'block';
      document.getElementById('trendChart').innerHTML = '';
      return;
    }
    document.getElementById('trendEmpty').style.display = 'none';
    renderTrendChart(byCategory[currentTrendCat] || Array(6).fill(0), months);
  }

  function selectTrendCat(name) {
    currentTrendCat = name;
    renderTrendView();
  }

  function renderTrendChart(amounts, months) {
    const svg = document.getElementById('trendChart');
    const W = 300, H = 170, padL = 44, padR = 10, padT = 22, padB = 28;
    const cW = W - padL - padR, cH = H - padT - padB;
    const n = amounts.length;
    const maxVal = Math.max(...amounts, 1);
    const mag = Math.pow(10, Math.floor(Math.log10(maxVal)));
    const niceMax = Math.ceil(maxVal / mag) * mag;
    const toX = i => padL + (n > 1 ? i * cW / (n - 1) : cW / 2);
    const toY = v => padT + cH - (v / niceMax) * cH;
    const pts = amounts.map((v, i) => `${toX(i).toFixed(1)},${toY(v).toFixed(1)}`).join(' ');
    const baseY = (padT + cH).toFixed(1);

    let html = `<defs><linearGradient id="trendGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8A33F" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#E8A33F" stop-opacity="0"/>
    </linearGradient></defs>`;

    [0.5, 1].forEach(frac => {
      const y = toY(niceMax * frac).toFixed(1);
      const val = Math.round(niceMax * frac);
      const lbl = val >= 10000 ? Math.round(val / 1000) + 'k' : val.toLocaleString();
      html += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="#EDE3D5" stroke-width="1"/>
        <text x="${padL - 4}" y="${(parseFloat(y) + 4).toFixed(1)}" text-anchor="end" font-size="10" fill="#C7BEB1">${lbl}</text>`;
    });
    html += `<line x1="${padL}" y1="${baseY}" x2="${W - padR}" y2="${baseY}" stroke="#EDE3D5" stroke-width="1"/>`;
    html += `<polygon points="${toX(0).toFixed(1)},${baseY} ${pts} ${toX(n - 1).toFixed(1)},${baseY}" fill="url(#trendGrad)"/>`;
    html += `<polyline points="${pts}" fill="none" stroke="#E8A33F" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    months.forEach((m, i) => {
      html += `<text x="${toX(i).toFixed(1)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="#9E9285">${parseInt(m.slice(5))}月</text>`;
    });
    amounts.forEach((v, i) => {
      const cx = toX(i).toFixed(1), cy = toY(v).toFixed(1);
      html += `<circle cx="${cx}" cy="${cy}" r="3.5" fill="white" stroke="#E8A33F" stroke-width="2"/>`;
      if (v > 0) {
        const lbl = v >= 10000 ? Math.round(v / 1000) + 'k' : v.toLocaleString();
        html += `<text x="${cx}" y="${(parseFloat(cy) - 7).toFixed(1)}" text-anchor="middle" font-size="10" fill="#E8A33F" font-weight="bold">${lbl}</text>`;
      }
    });
    svg.innerHTML = html;
  }

  // === 每日洞察 ===
  async function generateTodayInsight() {
    const btn = document.getElementById('insightBtn');
    btn.disabled = true;
    btn.textContent = '✨ 產生中...';
    try {
      const result = await gasAPI('generateInsight');
      if (result.success) {
        document.getElementById('insightText').textContent = result.insight;
        document.getElementById('insightTime').textContent = result.timestamp.replace('T', ' ');
        document.getElementById('insightCard').style.display = 'block';
      } else {
        alert(result.error || '產生失敗，請稍後再試');
      }
    } catch (err) {
      alert('載入失敗，請稍後再試');
      console.error(err);
    } finally {
      btn.disabled = false;
      btn.textContent = '✨ 產生洞察';
    }
  }

  async function showInsightHistory() {
    const list = document.getElementById('insightHistoryList');
    list.innerHTML = '<div style="text-align:center;color:#aaa;padding:20px;">載入中...</div>';
    document.getElementById('insightHistoryOverlay').classList.add('show');
    document.getElementById('insightHistoryModal').classList.add('show');
    try {
      const insights = await gasAPI('getInsights');
      if (!insights.length) {
        list.innerHTML = '<div style="text-align:center;color:#aaa;padding:20px;">尚無洞察紀錄</div>';
        return;
      }
      list.innerHTML = insights.map(item => `
        <div class="insight-history-item">
          <div class="insight-history-date">${item.timestamp.replace('T', ' ')}</div>
          <div class="insight-history-text">${item.insight}</div>
        </div>`).join('');
    } catch (err) {
      list.innerHTML = '<div style="text-align:center;color:#aaa;padding:20px;">載入失敗</div>';
    }
  }

  function closeInsightHistory() {
    document.getElementById('insightHistoryModal').classList.remove('show');
    document.getElementById('insightHistoryOverlay').classList.remove('show');
  }
</script>
